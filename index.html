<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventura — O Vale Perdido</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

/* =====================================================
   TELA INICIAL
===================================================== */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            rgba(8, 25, 42, .45),
            rgba(8, 25, 42, .75)
        ),
        linear-gradient(
            to bottom,
            #4ea9e8 0%,
            #8ed4f5 45%,
            #426b43 100%
        );

    color: white;
    text-align: center;
}

.start-content {
    width: min(90%, 700px);
    padding: 45px 30px;

    background: rgba(0, 0, 0, .35);
    backdrop-filter: blur(8px);

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 25px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.5),
        inset 0 0 30px rgba(255,255,255,.08);
}

.logo {
    font-size: clamp(45px, 8vw, 85px);
    font-weight: 900;

    color: #fff;
    text-shadow:
        0 4px 0 #315c35,
        0 8px 15px rgba(0,0,0,.5);

    margin-bottom: 5px;
}

.subtitle {
    font-size: clamp(18px, 3vw, 26px);
    color: #dff6ff;
    margin-bottom: 35px;
}

.start-description {
    font-size: 16px;
    line-height: 1.6;
    color: #eee;

    max-width: 520px;
    margin: 0 auto 30px;
}

#startButton {
    border: none;
    padding: 18px 42px;

    border-radius: 12px;

    background:
        linear-gradient(
            #ffd95a,
            #e99c18
        );

    color: #442500;

    font-size: 20px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 7px 0 #9b5e0c,
        0 12px 25px rgba(0,0,0,.35);

    transition: .15s;
}

#startButton:hover {
    transform: translateY(-3px);
    box-shadow:
        0 10px 0 #9b5e0c,
        0 16px 30px rgba(0,0,0,.4);
}

#startButton:active {
    transform: translateY(5px);
    box-shadow:
        0 2px 0 #9b5e0c,
        0 5px 10px rgba(0,0,0,.3);
}

.controls-info {
    margin-top: 28px;
    color: #ddd;
    font-size: 14px;
}

/* =====================================================
   JOGO
===================================================== */

#game {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #55b9ed 0%,
            #9cddf4 52%,
            #d6edca 53%,
            #83b66a 100%
        );
}

/* =====================================================
   MUNDO
===================================================== */

#world {
    position: absolute;

    width: 6000px;
    height: 100%;

    left: 0;
    top: 0;
}

/* =====================================================
   SOL
===================================================== */

#sun {
    position: absolute;

    width: 130px;
    height: 130px;

    top: 70px;
    left: 900px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fffbd1 0%,
            #ffe77c 45%,
            #ffc34d 70%,
            rgba(255,195,77,0) 71%
        );

    filter: blur(.5px);
}

/* =====================================================
   MONTANHAS
===================================================== */

.mountain {
    position: absolute;
    bottom: 270px;

    width: 0;
    height: 0;

    border-left: 220px solid transparent;
    border-right: 220px solid transparent;
    border-bottom: 330px solid #587b6b;

    opacity: .9;
}

.mountain::after {
    content: "";

    position: absolute;

    left: -80px;
    top: 80px;

    width: 0;
    height: 0;

    border-left: 80px solid transparent;
    border-right: 80px solid transparent;
    border-bottom: 120px solid #e9f3ed;
}

/* =====================================================
   ÁRVORES
===================================================== */

.tree {
    position: absolute;
    bottom: 270px;

    width: 35px;
    height: 150px;

    background:
        linear-gradient(
            90deg,
            #573719,
            #8c5b2c,
            #573719
        );

    border-radius: 5px;
}

.tree::before {
    content: "";

    position: absolute;

    width: 130px;
    height: 130px;

    left: -48px;
    top: -95px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 30%,
            #5fa94e,
            #36773c 65%,
            #24552d 100%
        );

    box-shadow:
        35px 20px 0 #397c3e,
        -25px 25px 0 #438843;
}

/* =====================================================
   NUVENS
===================================================== */

.cloud {
    position: absolute;

    width: 160px;
    height: 45px;

    background: rgba(255,255,255,.85);

    border-radius: 50px;

    filter: blur(.5px);
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background: rgba(255,255,255,.9);

    border-radius: 50%;
}

.cloud::before {
    width: 70px;
    height: 70px;

    left: 25px;
    top: -35px;
}

.cloud::after {
    width: 90px;
    height: 90px;

    right: 15px;
    top: -48px;
}

/* =====================================================
   TERRENO
===================================================== */

.ground {
    position: absolute;

    left: 0;
    top: 550px;

    width: 6000px;
    height: 300px;

    background:
        linear-gradient(
            to bottom,
            #78b84a 0px,
            #78b84a 15px,
            #704426 16px,
            #633b22 100%
        );

    border-top: 3px solid #9bd15d;
}

/* pequenas pedras no chão */

.rock {
    position: absolute;

    width: 25px;
    height: 15px;

    background:
        linear-gradient(
            135deg,
            #777,
            #444
        );

    border-radius: 60% 50% 30% 40%;
}

/* =====================================================
   PLATAFORMAS
===================================================== */

.platform {
    position: absolute;

    height: 38px;

    background:
        linear-gradient(
            to bottom,
            #75b94b 0px,
            #75b94b 9px,
            #80502c 10px,
            #61391e 100%
        );

    border-radius: 5px;

    box-shadow:
        inset 0 -5px rgba(0,0,0,.15),
        0 5px 8px rgba(0,0,0,.15);

    border: 2px solid #4f321e;
}

/* =====================================================
   JOGADOR
===================================================== */

#player {
    position: absolute;

    width: 42px;
    height: 62px;

    z-index: 50;

    background:
        linear-gradient(
            90deg,
            #1d5da8,
            #2c83d1,
            #174f91
        );

    border-radius: 9px 9px 5px 5px;

    box-shadow:
        inset -5px 0 rgba(0,0,0,.15),
        0 5px 5px rgba(0,0,0,.25);
}

/* cabeça */

#player::before {
    content: "";

    position: absolute;

    width: 39px;
    height: 36px;

    left: 2px;
    top: -28px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 60% 40%,
            #f4bd91,
            #d98b5e
        );

    border: 2px solid #a75d3c;
}

/* cabelo */

#player::after {
    content: "";

    position: absolute;

    width: 42px;
    height: 14px;

    left: 0;
    top: -29px;

    border-radius: 50% 50% 10px 10px;

    background: #3b2417;
}

/* =====================================================
   MOEDAS
===================================================== */

.coin {
    position: absolute;

    width: 27px;
    height: 32px;

    border-radius: 50%;

    z-index: 30;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff7a0,
            #ffd633 35%,
            #e79d00 100%
        );

    border: 3px solid #d89000;

    box-shadow:
        0 0 10px rgba(255,214,0,.5);

    animation:
        coinFloat 1s ease-in-out infinite,
        coinSpin .8s linear infinite;
}

@keyframes coinFloat {

    0%, 100% {
        margin-top: 0;
    }

    50% {
        margin-top: -8px;
    }

}

@keyframes coinSpin {

    0%, 100% {
        transform: scaleX(1);
    }

    50% {
        transform: scaleX(.35);
    }

}

/* =====================================================
   INIMIGO
===================================================== */

.enemy {
    position: absolute;

    width: 48px;
    height: 38px;

    z-index: 40;

    border-radius: 22px 22px 9px 9px;

    background:
        linear-gradient(
            to bottom,
            #89542c,
            #4f2d18
        );

    box-shadow:
        0 5px 6px rgba(0,0,0,.3);
}

.enemy::before,
.enemy::after {
    content: "";

    position: absolute;

    top: 10px;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: white;

    box-shadow:
        inset 0 0 0 3px #222;
}

.enemy::before {
    left: 10px;
}

.enemy::after {
    right: 10px;
}

/* =====================================================
   BANDEIRA
===================================================== */

#flag {
    position: absolute;

    width: 12px;
    height: 190px;

    background:
        linear-gradient(
            90deg,
            #ddd,
            #fff,
            #bbb
        );

    z-index: 20;
}

#flag::after {
    content: "";

    position: absolute;

    left: 12px;
    top: 5px;

    width: 85px;
    height: 55px;

    background:
        linear-gradient(
            135deg,
            #ef5350,
            #b71c1c
        );

    clip-path:
        polygon(
            0 0,
            100% 30%,
            0 60%
        );
}

/* =====================================================
   HUD
===================================================== */

#hud {
    position: fixed;

    z-index: 500;

    top: 15px;
    left: 20px;

    color: white;

    padding: 12px 18px;

    background: rgba(0,0,0,.35);

    border-radius: 12px;

    backdrop-filter: blur(5px);

    font-size: 18px;
    font-weight: bold;

    text-shadow: 2px 2px 3px #000;
}

/* =====================================================
   MENSAGEM
===================================================== */

#message {
    position: fixed;

    z-index: 900;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    display: none;

    text-align: center;

    color: white;

    padding: 40px;

    min-width: 320px;

    border-radius: 20px;

    background: rgba(0,0,0,.7);

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);

    text-shadow: 2px 2px #000;
}

#message button {
    margin-top: 20px;

    padding: 13px 25px;

    border: none;
    border-radius: 10px;

    background: #ffd23f;

    color: #422b00;

    font-weight: bold;
    font-size: 17px;

    cursor: pointer;
}

/* =====================================================
   CONTROLES
===================================================== */

#controls {
    position: fixed;

    z-index: 700;

    bottom: 20px;

    left: 20px;
    right: 20px;

    display: flex;

    justify-content: space-between;

    pointer-events: none;
}

.control-group {
    display: flex;
    gap: 12px;
}

.control {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,.7);

    background: rgba(0,0,0,.35);

    color: white;

    font-size: 28px;

    pointer-events: auto;

    touch-action: none;
}

@media (min-width: 800px) {

    #controls {
        display: none;
    }

}
</style>
</head>

<body>

<!-- =====================================================

===================================================== -->

<div id="startScreen">

<!-- =====================================================

<div id="game">

<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const player =
    document.getElementById("player");

const world =
    document.getElementById("world");

const coinsText =
    document.getElementById("coins");

const livesText =
    document.getElementById("lives");

const message =
    document.getElementById("message");

const messageText =
    document.getElementById("messageText");

const platforms =
    [...document.querySelectorAll(".platform")];

const coins =
    [...document.querySelectorAll(".coin")];

const enemies =
    [...document.querySelectorAll(".enemy")];

const flag =
    document.getElementById("flag");


/* =====================================================
   ESTADO
===================================================== */

let gameRunning = false;

let playerX = 100;
let playerY = 470;

let velocityX = 0;
let velocityY = 0;

let speed = 5;
let jumpPower = 14;

let gravity = .65;

let grounded = false;

let cameraX = 0;

let score = 0;
let lives = 3;

const worldWidth = 6000;


/* =====================================================
   CONTROLES
===================================================== */

const keys = {
    left: false,
    right: false,
    jump: false
};


/* =====================================================
   INICIAR
===================================================== */

startButton.addEventListener("click", () => {

    startScreen.style.display = "none";

    gameRunning = true;

    requestAnimationFrame(gameLoop);

});


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener("keydown", event => {

    if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {
        keys.left = true;
    }

    if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {
        keys.right = true;
    }

    if (
        event.key === "ArrowUp" ||
        event.key.toLowerCase() === "w" ||
        event.key === " "
    ) {

        keys.jump = true;

        event.preventDefault();

    }

});


document.addEventListener("keyup", event => {

    if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {
        keys.left = false;
    }

    if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {
        keys.right = false;
    }

    if (
        event.key === "ArrowUp" ||
        event.key.toLowerCase() === "w" ||
        event.key === " "
    ) {
        keys.jump = false;
    }

});


/* =====================================================
   CONTROLES DE CELULAR
===================================================== */

function mobileButton(id, key) {

    const button =
        document.getElementById(id);

    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            keys[key] = true;

        }
    );

    button.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();

            keys[key] = false;

        }
    );

    button.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;

        }
    );

    button.addEventListener(
        "pointerleave",
        () => {

            keys[key] = false;

        }
    );
}


mobileButton("left", "left");
mobileButton("right", "right");
mobileButton("jump", "jump");


/* =====================================================
   COLISÃO
===================================================== */

function collision(a, b) {

    return (

        a.x < b.x + b.width &&

        a.x + a.width > b.x &&

        a.y < b.y + b.height &&

        a.y + a.height > b.y

    );

}


/* =====================================================
   RETÂNGULO DO PLAYER
===================================================== */

function playerRect() {

    return {

        x: playerX,
        y: playerY,

        width: player.offsetWidth,
        height: player.offsetHeight

    };

}


/* =====================================================
   ATUALIZAR PLAYER
===================================================== */

function updatePlayer() {

    const oldY = playerY;

    velocityX = 0;


    if (keys.left) {

        velocityX = -speed;

    }


    if (keys.right) {

        velocityX = speed;

    }


    playerX += velocityX;


    if (playerX < 0) {

        playerX = 0;

    }


    if (playerX > worldWidth - 100) {

        playerX = worldWidth - 100;

    }


    /* Pulo */

    if (
        keys.jump &&
        grounded
    ) {

        velocityY = -jumpPower;

        grounded = false;

    }


    velocityY += gravity;

    playerY += velocityY;

    grounded = false;


    const p =
        playerRect();


    /* Plataformas */

    for (const platform of platforms) {

        const r = {

            x: platform.offsetLeft,
            y: platform.offsetTop,

            width: platform.offsetWidth,
            height: platform.offsetHeight

        };


        if (

            p.x < r.x + r.width &&

            p.x + p.width > r.x &&

            oldY + p.height <= r.y + 8 &&

            playerY + p.height >= r.y &&

            velocityY >= 0

        ) {

            playerY =
                r.y - p.height;

            velocityY = 0;

            grounded = true;

        }

    }


    /* Caiu */

    if (playerY > 750) {

        loseLife();

    }


    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =====================================================
   MOEDAS
===================================================== */

function collectCoins() {

    const p =
        playerRect();


    coins.forEach(coin => {

        if (
            coin.dataset.collected
        ) {
            return;
        }


        const r = {

            x: coin.offsetLeft,
            y: coin.offsetTop,

            width: coin.offsetWidth,
            height: coin.offsetHeight

        };


        if (
            collision(p, r)
        ) {

            coin.dataset.collected =
                "true";

            coin.style.display =
                "none";

            score++;

            coinsText.textContent =
                score;

        }

    });

}


/* =====================================================
   INIMIGOS
===================================================== */

function updateEnemies() {

    const p =
        playerRect();


    enemies.forEach(enemy => {

        if (
            enemy.dataset.dead
        ) {
            return;
        }


        let x =
            parseFloat(
                enemy.style.left
            );


        const startX =
            Number(enemy.dataset.x);


        if (
            !enemy.dataset.direction
        ) {

            enemy.dataset.direction =
                "1";

        }


        let direction =
            Number(
                enemy.dataset.direction
            );


        x += direction * 1.2;


        if (
            x > startX + 100
        ) {

            direction = -1;

        }


        if (
            x < startX - 100
        ) {

            direction = 1;

        }


        enemy.dataset.direction =
            direction;

        enemy.style.left =
            x + "px";


        const r = {

            x: x,
            y: enemy.offsetTop,

            width: enemy.offsetWidth,
            height: enemy.offsetHeight

        };


        if (
            collision(p, r)
        ) {

            /* Pisou no inimigo */

            if (

                velocityY > 0 &&

                p.y + p.height - 10 <
                r.y + 15

            ) {

                enemy.dataset.dead =
                    "true";

                enemy.style.transform =
                    "scaleY(.25)";

                velocityY =
                    -8;

            }

            else {

                loseLife();

            }

        }

    });

}


/* =====================================================
   CHEGAR NA BANDEIRA
===================================================== */

function checkFlag() {

    const p =
        playerRect();


    const r = {

        x: flag.offsetLeft,
        y: flag.offsetTop,

        width: 100,
        height: flag.offsetHeight

    };


    if (
        collision(p, r)
    ) {

        winGame();

    }

}


/* =====================================================
   CÂMERA
===================================================== */

function updateCamera() {

    const center =
        window.innerWidth / 2;


    cameraX =
        playerX - center;


    if (cameraX < 0) {

        cameraX = 0;

    }


    const maxCamera =
        worldWidth -
        window.innerWidth;


    if (
        cameraX > maxCamera
    ) {

        cameraX =
            maxCamera;

    }


    world.style.transform =
        `translateX(${-cameraX}px)`;

}


/* =====================================================
   PERDE VIDA
===================================================== */

function loseLife() {

    lives--;

    livesText.textContent =
        lives;


    if (lives <= 0) {

        gameOver();

        return;

    }


    playerX = 100;
    playerY = 470;

    velocityX = 0;
    velocityY = 0;

}


/* =====================================================
   VITÓRIA
===================================================== */

function winGame() {

    gameRunning = false;

    messageText.innerHTML =

        "🏆 VOCÊ CHEGOU AO FINAL!<br>" +

        "<small>" +
        "Moedas coletadas: " +
        score +
        "</small>";

    message.style.display =
        "block";

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver() {

    gameRunning = false;

    messageText.innerHTML =

        "💀 FIM DE JOGO<br>" +

        "<small>" +
        "Moedas coletadas: " +
        score +
        "</small>";

    message.style.display =
        "block";

}


/* =====================================================
   REINICIAR
===================================================== */

function restartGame() {

    location.reload();

}


/* =====================================================
   LOOP
===================================================== */

function gameLoop() {

    if (!gameRunning) {
        return;
    }


    updatePlayer();

    updateEnemies();

    collectCoins();

    checkFlag();

    updateCamera();


    requestAnimationFrame(
        gameLoop
    );

}

</script>

</body>
